name: Involute CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest pytest-asyncio pytest-cov pydantic

    - name: Run Test Coverage and C Harness
      run: |
        chmod +x test_coverage.sh
        ./test_coverage.sh

    - name: Build Sdist and Wheel Artifacts
      run: |
        python -m build

    - name: Archive Production Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: involute-dist
        path: dist/
